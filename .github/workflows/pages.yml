name: Publish website
on:
  push:
    branches: [main]
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Check upload handling
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Prepare public files and APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build.py --github-repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
